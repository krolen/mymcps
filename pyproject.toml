[project]
name = "mcp-servers"
version = "0.1.0"
description = "MCP servers with SearXNG search and Crawl4AI crawling, intentional viewport and Windows/Linux Chrome user-agent rotation, browser reuse, and local cleanup fallback"
requires-python = ">=3.12"
dependencies = [
    "fastmcp==4.1.4",
    "httpx==0.28.1",
    "requests==2.34.2",
    "crawl4ai==0.9.5",
    "pydantic==2.14.2",
    "beautifulsoup4==4.15.0",
    "curl-cffi==0.17.0",
    "clickhouse-driver==0.2.11",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
addopts = "-s"
log_cli = true
log_cli_level = "INFO"
