[project]
name = "mcp-servers"
version = "0.1.0"
description = "MCP Servers collection including SearXNG search"
requires-python = ">=3.12"
dependencies = [
    "fastmcp==3.2.4",
    "httpx==0.28.1",
    "requests==2.33.1",
    "crawl4ai==0.8.6",
    "pydantic==2.13.4",
    "beautifulsoup4==4.14.3",
    "curl-cffi==0.15.0",
    "clickhouse-driver==0.2.10",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
addopts = "-s"
log_cli = true
log_cli_level = "INFO"
